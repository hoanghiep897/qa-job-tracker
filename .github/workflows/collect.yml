name: Collect public QA jobs
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
permissions:
  contents: write
concurrency:
  group: qa-jobs-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect approved public ATS feeds
        run: python -m tracker.export --config config/boards.json --output data/jobs.json
      - name: Publish changed JSON (no secrets)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh observed QA jobs"
            git push
          fi
