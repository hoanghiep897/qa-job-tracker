name: Sync owner Google Sheet to QA dashboard
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-sheet-sync.yml"
      - "tracker/google_sheet_sync.py"
      - "tracker/sheet_database.py"
      - "config/google_sheet.json"
  schedule:
    - cron: "50 23 * * *" # 06:50 next day in Vietnam (UTC+7; 23:50 UTC previous day)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-jobs-collection
  cancel-in-progress: false
jobs:
  sync_google_sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private-sheet authentication support
        run: python -m pip install "google-auth[requests]>=2.30,<3"
      - name: Read owner Sheet and update SQLite database + current snapshot
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python -m tracker.sheet_database --config config/google_sheet.json --output data/jobs.json --database data/jobs.sqlite3
      - name: Commit current Sheet JSON and versioned SQLite history after successful sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.json data/jobs.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Sheet-only jobs and SQLite history"
            git push
          fi
