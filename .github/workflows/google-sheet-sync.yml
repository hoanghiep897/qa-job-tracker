name: Sync owner Google Sheet to QA dashboard
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-sheet-sync.yml"
      - "tracker/google_sheet_sync.py"
      - "config/google_sheet.json"
  schedule:
    - cron: "0 0 * * *" # 07:00 Asia/Bangkok (UTC+7)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-jobs-collection
  cancel-in-progress: false
jobs:
  sync_google_sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private-sheet authentication support
        run: python -m pip install "google-auth[requests]>=2.30,<3"
      - name: Read and merge Google Sheet QA jobs
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python -m tracker.google_sheet_sync --config config/google_sheet.json --output data/jobs.json
      - name: Publish updated job JSON after successful synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh user Google Sheet QA jobs"
            git push
          fi
