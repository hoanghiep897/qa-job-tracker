name: TechJobs feed QA coverage probe (read only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/techjobs-probe.yml"
      - "tracker/techjobs_diagnose.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnose documented TechJobs feed endpoints (status only)
        run: python -m tracker.techjobs_diagnose
      - name: Probe TechJobs public feed (no publish, no secrets)
        run: python -m tracker.techjobs_probe --max-pages 2 --per-page 200
