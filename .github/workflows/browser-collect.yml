name: Manual licensed browser QA job diagnostics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-collect.yml"
      - "tracker/licensed_html.py"
      - "tracker/browser_crawler.py"
      - "tracker/browser_daily.py"
      - "config/boards.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-jobs-collection
  cancel-in-progress: false
jobs:
  playwright_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser runtime
        run: |
          python -m pip install "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Test TopCV (max 5 details)
        id: topcv
        continue-on-error: true
        run: python -m tracker.browser_daily --platform topcv
      - name: Test VietnamWorks (max 5 details)
        id: vietnamworks
        continue-on-error: true
        run: python -m tracker.browser_daily --platform vietnamworks
      - name: Report browser-source outcomes
        if: always()
        run: |
          echo "### Browser source results" >> "$GITHUB_STEP_SUMMARY"
          echo "- TopCV: ${{ steps.topcv.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- VietnamWorks: ${{ steps.vietnamworks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source failures preserve the last good data/jobs.json." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish new observed metadata only after successful scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh browser-observed QA jobs"
            git push
          fi
      - name: Fail scan if neither source could be collected
        if: ${{ steps.topcv.outcome != 'success' && steps.vietnamworks.outcome != 'success' }}
        run: |
          echo "Both browser sources failed. Existing JSON was preserved."
          exit 1
