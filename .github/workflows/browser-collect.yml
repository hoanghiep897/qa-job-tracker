name: Daily licensed browser QA job scan
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-collect.yml"
  schedule:
    - cron: "0 0 * * *" # 07:00 Asia/Bangkok
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-jobs-collection
  cancel-in-progress: false
jobs:
  playwright_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser runtime
        run: |
          python -m pip install "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Collect at most five licensed ITviec job details
        run: python -m tracker.browser_daily --platform itviec
      - name: Publish new observed metadata only after successful scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh browser-observed QA jobs"
            git push
          fi
